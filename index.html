<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14100F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="備婚統籌台">
<meta name="robots" content="noindex">
<title>毛 × 哈利 · 備婚統籌台</title>
<style>
:root{
  color-scheme:dark;
  --sunk:var(--sunk);
  --ink:#14100F;      /* 墨 */
  --stone:#2A211C;    /* 硯 */
  --gold:#D9AE4A;     /* 金 */
  --peach:#E86A82;    /* 桃 */
  --chop:#B8332B;     /* 硃 */
  --paper:#EFE6D6;    /* 宣 */
  --muted:rgba(239,230,214,.46);
  --dim:rgba(239,230,214,.66);
  --rule:rgba(217,174,74,.24);
  --rule-2:rgba(217,174,74,.13);
  --field:rgba(239,230,214,.05);
}
body.light{
  color-scheme:light;
  --ink:#F2ECDF;      /* 宣紙為底 */
  --stone:#FFFCF6;
  --paper:#1E1815;    /* 墨為字 */
  --muted:rgba(30,24,21,.50);
  --dim:rgba(30,24,21,.74);
  --rule:rgba(30,24,21,.20);
  --rule-2:rgba(30,24,21,.11);
  --field:rgba(30,24,21,.05);
  --sunk:rgba(30,24,21,.035);
  --gold:#9C7327;     /* 金在紙上壓深，線與標籤才看得清 */
  --peach:#CF476A;
  --chop:#A82D25;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font-family:"PingFang TC","PingFang SC","Hiragino Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:14px;line-height:1.62;-webkit-text-size-adjust:100%}
.serif{font-family:"Songti TC","Songti SC","Noto Serif TC","Source Han Serif TC",Georgia,serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 70px;position:relative}
::selection{background:var(--peach);color:var(--ink)}

header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:24px 0 14px}
h1{font-family:"Songti TC","Songti SC","Noto Serif TC",Georgia,serif;font-size:25px;font-weight:600;margin:0;letter-spacing:.08em}
h1 .amp{color:var(--peach);padding:0 .2em}
.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.saved{font-size:12px;color:var(--muted);min-width:62px}
button{font:inherit;cursor:pointer}
.btn{background:transparent;border:1px solid var(--rule);color:var(--dim);padding:5px 11px;border-radius:0;font-size:12.5px}
.btn:hover{border-color:var(--gold);color:var(--paper)}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.tab:focus-visible,.sub:focus-visible,.dayhd:focus-visible,.go:focus-visible{outline:1px solid var(--peach);outline-offset:2px}

/* ---- 界行：直式界欄，只用在題頭這一帶 ---- */
.journey{
  border-top:1px solid var(--gold);border-bottom:1px solid var(--rule);
  padding:22px 0 0;position:relative;
}
.rail{display:grid;grid-template-columns:repeat(3,1fr);position:relative;gap:8px}
.rail::before{content:"";position:absolute;left:8%;right:8%;top:6px;height:1px;background:var(--rule)}
.stop{position:relative;padding:20px 2px 6px;text-align:center;min-width:0;background:none;border:none;color:var(--paper);font:inherit;cursor:pointer;display:block;width:100%}
.stop:hover .what{color:var(--peach)}
.stop:hover .dot{border-color:var(--peach)}
.stop .enter{font-size:10.5px;color:var(--muted);margin-top:3px;letter-spacing:.08em}
.stop:hover .enter{color:var(--peach)}
.stop .dot{position:absolute;top:0;left:50%;transform:translateX(-50%);width:11px;height:11px;background:var(--ink);border:1px solid var(--muted)}
.stop.done .dot{background:var(--gold);border-color:var(--gold)}
.stop.next .dot{background:var(--peach);border-color:var(--peach);box-shadow:0 0 0 4px rgba(232,106,130,.16)}
.stop.next::after{content:"";position:absolute;left:50%;top:14px;bottom:2px;width:1px;background:linear-gradient(var(--peach),transparent);opacity:.35}
.stop .when{font-size:11px;color:var(--muted);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.stop .what{font-family:"Songti TC","Songti SC",serif;font-size:16px;margin-top:1px;white-space:nowrap}
.stop.next .what{color:var(--peach)}
.stop .left{font-family:"Songti TC","Songti SC",serif;font-size:12px;color:var(--dim);margin-top:1px;white-space:nowrap}
.stop .num{font-size:24px;line-height:1.1;vertical-align:-2px;margin-right:1px;color:var(--paper)}
.stop.next .num{color:var(--peach)}
.stop .place{font-size:11px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.brief{display:flex;align-items:center;border-top:1px solid var(--rule-2);margin-top:15px;font-size:12.5px;color:var(--dim)}
.brief .b{padding:9px 14px;border-left:1px solid var(--rule-2);white-space:nowrap}
.brief .b:first-child{padding-left:0;border-left:none;flex:1;min-width:0;overflow:hidden;display:flex;gap:8px;align-items:baseline}
.brief .lb{color:var(--muted);font-size:11.5px}
.brief b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--paper)}
.brief .go{background:none;border:none;padding:0;color:var(--paper);font:inherit;text-align:left;border-bottom:1px solid var(--peach);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brief .go:hover{color:var(--peach)}
.brief .warn,.brief b.warn{color:var(--chop)}

nav{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--rule);margin:16px 0 0}
.tab{white-space:nowrap;background:none;border:none;border-bottom:2px solid transparent;padding:10px 15px 9px;color:var(--dim);font-size:14px;margin-bottom:-1px;font-family:"Songti TC","Songti SC",serif}
.tab:hover{color:var(--paper)}
.tab.on{color:var(--peach);border-bottom-color:var(--peach)}
.subnav{display:flex;gap:16px;overflow-x:auto;padding:9px 2px 0;margin-bottom:14px}
.subnav:empty{display:none}
.sub{white-space:nowrap;background:none;border:none;padding:2px 0;color:var(--muted);font-size:13px;border-bottom:1px solid transparent}
.sub:hover{color:var(--paper)}
.sub.on{color:var(--paper);border-bottom-color:var(--gold)}
.sub .badge{color:var(--chop);font-size:11px;margin-left:5px}

.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 8px}
.sec-head h2{font-family:"Songti TC","Songti SC",serif;font-size:18px;font-weight:600;margin:0}
.hint{color:var(--muted);font-size:12.5px;max-width:64ch;margin:2px 0 14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select,.filters input{border:1px solid var(--rule);background:var(--stone);border-radius:0;padding:5px 8px;font:inherit;font-size:12.5px;color:var(--paper)}
.filters .hint{margin:0}
.spacer{flex:1}
.fx{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.fx input{width:66px;text-align:right;font-variant-numeric:tabular-nums}

/* ---- 表格 ---- */
.tw{overflow-x:auto;border:1px solid var(--rule);background:var(--stone)}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font-weight:600;font-size:12px;color:var(--dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--gold);white-space:nowrap;background:var(--stone);position:sticky;top:0;z-index:1}
td{border-bottom:1px solid var(--rule-2);padding:0;vertical-align:middle}
tr:hover td{background:var(--field)}
td input,td select,td textarea{width:100%;border:none;background:transparent;font:inherit;font-size:13px;color:var(--paper);padding:7px 10px;resize:none}
td textarea{min-height:34px;line-height:1.45}
td input:focus,td select:focus,td textarea:focus{background:var(--field);box-shadow:inset 0 0 0 1px var(--gold)}
td select{-webkit-appearance:none;appearance:none;cursor:pointer}
td option{background:var(--stone);color:var(--paper)}
td.num input{text-align:right;font-variant-numeric:tabular-nums}
td.twd{padding:0 10px;text-align:right;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.del{border:none;background:none;color:var(--muted);font-size:15px;line-height:1;padding:6px 9px}
.del:hover{color:var(--chop)}
.rowadd{margin-top:8px}
.addrow{padding:6px 10px 8px 46px;border-top:1px solid var(--rule-2)}
.btn{white-space:nowrap}
.btn.primary{border-color:var(--gold);color:var(--gold)}
.chip{max-width:100%}
.chip>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}
.vpick select,.vpick input{max-width:100%;min-width:0}
.vpick .row2>*{min-width:0}
.dgrid>*{min-width:0}
.mshead .btn{flex:none}
.legend{font-size:12px;color:var(--muted);margin-top:8px;max-width:72ch}
.st-已完成,.st-已定,.st-出席,.st-可,.st-已鎖,.st-已結清,.st-已共識,.st-已落地{color:var(--gold)}
.st-待確認,.st-待問,.st-待定,.st-定金已付,.st-尾款待付,.st-溝通中,.st-待收{color:var(--peach)}
.st-已取消,.st-不可,.st-不出席,.st-已淘汰,.st-不做{color:var(--chop)}

/* ---- Rundown ---- */
.day{border:1px solid var(--rule);background:var(--stone);margin-bottom:7px}
.day.open{border-color:var(--rule)}
.dayhd{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;padding:9px 14px;color:var(--paper);cursor:pointer}
.day.open .dayhd{border-bottom:1px solid var(--rule-2)}
.day.dropinto{outline:1px solid var(--peach)}
.dayhd .chev{color:var(--muted);font-size:11px;width:12px;flex:none;transition:transform .15s}
.day.open .dayhd .chev{transform:rotate(90deg)}
.dayhd .cal{font-family:"Songti TC","Songti SC",serif;font-size:16px;min-width:86px;font-variant-numeric:tabular-nums}
.dayhd .caldate{font-family:"Songti TC","Songti SC",serif;font-size:15px;background:transparent;border:1px solid transparent;color:var(--paper);padding:2px 4px;width:146px;flex:none;font-variant-numeric:tabular-nums;cursor:text}
.dayhd .caldate:hover{border-color:var(--rule)}
.dayhd .caldate:focus{border-color:var(--gold);background:var(--ink)}
.dayhd .wd{font-size:12px;color:var(--muted)}
.dayhd .cd{font-size:12px;color:var(--dim)}
.dayhd .cd.soonest{color:var(--peach)}
.dayhd .cd.past{color:var(--chop)}
.dayhd .grow{flex:1;min-width:0}
.peek{padding:0 14px 10px 38px;cursor:pointer}
.day.open .peek{display:none}
.pk{display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--dim);padding:2px 0}
.pk .pkdot{flex:none;width:5px;height:5px;background:var(--muted);border-radius:50%;transform:translateY(-2px)}
.pk.ms .pkdot{background:var(--peach)}
.pk.done{color:var(--muted)}
.pk.done .pkname{text-decoration:line-through}
.pk .pkname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk .pkt{flex:none;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.pk .pkown{flex:none;margin-left:auto;color:var(--muted);font-size:11.5px}
.dayhd .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dayhd .mini{width:52px;height:2px;background:var(--rule-2);position:relative;flex:none}
.dayhd .mini i{position:absolute;inset:0 auto 0 0;background:var(--gold)}
.daybody{display:none}
.day.open .daybody{display:block}

.task{display:grid;grid-template-columns:20px 26px 1fr auto 30px;align-items:center;border-top:1px solid var(--rule-2);padding:2px 10px 2px 2px}
.task:first-child{border-top:none}
.task:hover{background:var(--field)}
.task.dragging{opacity:.35}
.task.dropbefore{box-shadow:inset 0 2px 0 var(--peach)}
.task.dropafter{box-shadow:inset 0 -2px 0 var(--peach)}
.handle{cursor:grab;color:var(--muted);font-size:12px;text-align:center;user-select:none;line-height:1}
.handle:active{cursor:grabbing}
.task:hover .handle{color:var(--gold)}
.tkwrap{display:flex;align-items:center;gap:6px;min-width:0}
.mstag{flex:none;border:1px solid var(--peach);color:var(--peach);font-size:10.5px;padding:0 5px;line-height:1.5;letter-spacing:.08em}
.task .chk{justify-self:center;width:15px;height:15px;accent-color:var(--gold);cursor:pointer}
.task .tk{border:none;background:transparent;font:inherit;font-size:13.5px;padding:8px 6px;width:100%;color:var(--paper)}
.task.done .tk{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;gap:4px;align-items:center}
.meta input,.meta select{border:none;background:transparent;font:inherit;font-size:12.5px;color:var(--dim);padding:5px 4px;-webkit-appearance:none;appearance:none;cursor:pointer}
.meta option{background:var(--stone);color:var(--paper)}
.meta .w-time{width:62px;font-variant-numeric:tabular-nums;text-align:right}
.meta .w-cat{width:100px}
.meta .w-own{width:86px}
.meta .w-lia{width:94px}
.meta .w-ven{width:108px;cursor:text}
.venbtn{border:1px dashed var(--rule);background:transparent;color:var(--dim);font-size:12px;padding:4px 8px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.venbtn:hover{border-color:var(--gold);color:var(--paper)}
.venbtn.empty{color:var(--muted)}
.venbtn.linked{border-style:solid;border-color:var(--gold);color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gold);color:var(--gold);font-size:12px;padding:2px 4px 2px 8px;margin:0 6px 6px 0}
.chip .x{border:none;background:none;color:var(--gold);font-size:13px;line-height:1;padding:0 3px;cursor:pointer}
.chip .x:hover{color:var(--chop)}
.chip.legacy{border-style:dashed;border-color:var(--rule);color:var(--muted)}
.vpick{margin:4px 0 2px}
.vpick .row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.vpick select,.vpick input{border:1px solid var(--rule);background:var(--stone);color:var(--paper);font:inherit;font-size:12.5px;padding:4px 7px}
.vpick .sum{font-size:12px;color:var(--muted);margin-top:6px}
.usedby{font-size:12px;color:var(--muted);margin-top:8px}
.task input:focus,.task select:focus{background:var(--field);box-shadow:inset 0 0 0 1px var(--gold)}
.exp{border:none;background:none;color:var(--muted);font-size:12px;padding:6px}
.exp:hover{color:var(--peach)}
.detail{border-top:1px solid var(--rule-2);background:var(--sunk);padding:12px 16px 14px 42px}
.dgrid{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:9px}
.dgrid label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dgrid input,.dgrid select{border:1px solid var(--rule);background:var(--stone);padding:4px 7px;font:inherit;font-size:12.5px;color:var(--paper)}
.detail textarea,.vdetail textarea{width:100%;border:1px solid var(--rule);background:var(--stone);font:inherit;font-size:13px;padding:8px 10px;line-height:1.6;resize:vertical;min-height:52px;color:var(--paper)}
.mshead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--rule-2)}
.mshead .msname{font-size:15px;color:var(--peach)}
.mshead .lb{font-size:12px;color:var(--muted)}
.lbl2{font-size:12px;color:var(--muted);margin:10px 0 4px}
.steps{margin:10px 0 0}
.steps .lbl{font-size:12px;color:var(--muted);margin-bottom:4px}
.step{display:flex;align-items:center;gap:8px;padding:1px 0}
.step input[type=checkbox]{width:14px;height:14px;accent-color:var(--gold)}
.step input[type=text]{flex:1;border:none;border-bottom:1px solid var(--rule-2);background:transparent;font:inherit;font-size:13px;padding:4px 2px;color:var(--paper)}
.step.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.fwrap{overflow-x:auto;border:1px solid var(--rule);background:var(--stone)}
.finner{min-width:1020px}
.fhead,.frow{display:grid;grid-template-columns:20px 74px 62px minmax(150px,1fr) 126px 92px 148px 148px 26px 26px;gap:2px;align-items:center}
.fhead{padding:7px 6px 7px 2px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--gold)}
.fhead span{padding:0 5px;white-space:nowrap}
.frow{border-top:1px solid var(--rule-2);padding:2px 6px 2px 2px}
.frow:first-of-type{border-top:none}
.frow:hover{background:var(--field)}
.frow.dragging{opacity:.35}
.frow.dropbefore{box-shadow:inset 0 2px 0 var(--peach)}
.frow.dropafter{box-shadow:inset 0 -2px 0 var(--peach)}
.frow input,.frow select{border:none;background:transparent;font:inherit;font-size:12.5px;color:var(--paper);padding:7px 5px;width:100%;-webkit-appearance:none;appearance:none}
.frow select{cursor:pointer}
.frow option{background:var(--stone);color:var(--paper)}
.frow input:focus,.frow select:focus{background:var(--field);box-shadow:inset 0 0 0 1px var(--gold)}
.frow .f-t{font-family:"Songti TC","Songti SC",serif;font-size:15px;font-variant-numeric:tabular-nums;text-align:right;color:var(--gold)}
.frow .f-l{color:var(--dim);text-align:center}
.frow .f-i{font-size:13.5px}
.frow .venbtn{width:100%;max-width:100%;font-size:12px}
.cinfo{margin-top:8px;border-top:1px solid var(--rule-2);padding-top:6px}
.ci{display:flex;align-items:baseline;gap:10px;font-size:12.5px;color:var(--dim);padding:2px 0;flex-wrap:wrap}
.ci .ciname{color:var(--paper)}
.ci .cirole{color:var(--muted);font-size:11.5px}
.tiny{border:none;background:none;color:var(--muted);font-size:11.5px;padding:0;border-bottom:1px solid var(--rule-2);cursor:pointer}
.tiny:hover{color:var(--peach);border-color:var(--peach)}
.addday{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.addday input{border:1px solid var(--rule);background:var(--stone);padding:5px 8px;font:inherit;font-size:12.5px;color:var(--paper)}

/* ---- 供應商 ---- */
.vend{border:1px solid var(--rule);background:var(--stone);margin-bottom:7px}
.vhd,.vhead{display:grid;grid-template-columns:104px 1fr 116px 70px 84px 84px 48px 48px 56px 88px 78px 28px;gap:2px;align-items:center}
.vtoggle{border:1px solid var(--rule);background:transparent;color:var(--gold);font-size:11.5px;padding:5px 4px;white-space:nowrap;width:100%}
.vtoggle:hover{border-color:var(--peach);color:var(--peach)}
.vtoggle.open{color:var(--peach);border-color:var(--peach)}
.vtoggle.empty{color:var(--peach);border-color:rgba(232,106,130,.5)}
.vhd{padding:2px 8px}
.vhead{padding:0 8px 6px;font-size:11.5px;color:var(--muted)}
.vhead span{padding:0 5px}
.vhead .c{text-align:center}
.vhd input,.vhd select{border:none;background:transparent;font:inherit;font-size:13px;padding:8px 5px;width:100%;color:var(--paper);-webkit-appearance:none;appearance:none}
.vhd option{background:var(--stone);color:var(--paper)}
.vhd input:focus,.vhd select:focus{background:var(--field);box-shadow:inset 0 0 0 1px var(--gold)}
.vhd .money{text-align:right;font-variant-numeric:tabular-nums}
.vhd .twd{text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 5px;white-space:nowrap}
.vhd .sc{text-align:center;font-family:"Songti TC","Songti SC",serif;font-size:15px;font-variant-numeric:tabular-nums;color:var(--dim)}
.vhd .sc.tot{color:var(--gold);font-size:17px}
.vhd .sc.gap{color:var(--chop)}
.vwrap{overflow-x:auto}
.vinner{min-width:1030px}
.vdetail{border-top:1px solid var(--rule-2);background:var(--sunk);padding:12px 16px}
.stab{border-collapse:collapse;margin-bottom:10px;min-width:0}
.stab th{background:none;border-bottom:1px solid var(--rule);position:static;font-size:11.5px;padding:4px 10px}
.stab td{border-bottom:1px solid var(--rule-2);padding:3px 10px;font-size:12.5px}
.stab select{border:1px solid var(--rule);background:var(--stone);font:inherit;font-size:12.5px;padding:3px 6px;width:62px;color:var(--paper)}
.stab .w{color:var(--muted);font-size:11.5px}
.reasons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.reasons label{font-size:12px;color:var(--muted)}
.flag{display:inline-block;font-size:11.5px;color:var(--chop);border:1px solid var(--chop);padding:1px 7px;margin-left:8px}

/* ---- 總覽 ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--rule-2);border:1px solid var(--rule);margin-bottom:22px}
.cell{background:var(--stone);padding:14px 16px}
.cell .k{font-size:12px;color:var(--muted)}

/* ================= 工具 ================= */
function uid(){return 'r'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function parseD(s){if(!s)return null;var p=String(s).split('-');if(p.length<3)return null;var d=new Date(+p[0],+p[1]-1,+p[2]);return isNaN(d.getTime())?null:d;}
function daysTo(s){var d=parseD(s);if(!d)return null;return Math.round((d-today())/86400000);}
function fmtN(n){return (Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:0});}
function cny(n){return '¥'+fmtN(n);}
function twd(n){return 'NT$'+fmtN(Math.round((Number(n)||0)*fx()));}
function both(n){return cny(n)+'　'+twd(n);}
function fx(){return (state&&Number(state.fx))||FX_DEFAULT;}
function fmtMD(s){var p=String(s).split('-');return (+p[1])+'/'+(+p[2]);}
function todayISO(){var d=new Date(),m=('0'+(d.getMonth()+1)).slice(-2),dd=('0'+d.getDate()).slice(-2);return d.getFullYear()+'-'+m+'-'+dd;}

function migrate(s){
  if(!s)return fresh();
  if(!s.fx)s.fx=FX_DEFAULT;
  (s.rundown||[]).forEach(function(r){
    if(r.steps==null)r.steps=[];
    if(r.detail==null)r.detail=r.note||'';
    if(r.ms==null)r.ms='';
    if(r.info==null)r.info='';
    if(!r.vids)r.vids=[];
    delete r.phase;
  });
  (s.vendors||[]).forEach(function(r){
    if(r.cat==='約拍/婚紗照')r.cat='婚紗/旅拍';
    if(r.m_work===undefined){
      var old={work:r.r1,price:r.r2,comm:r.r3,rep:r.r4,deal:r.r5};
      DIMS.forEach(function(d){r['m_'+d.k]=old[d.k]||'';r['h_'+d.k]='';});
      ['r1','r2','r3','r4','r5','score'].forEach(function(k){delete r[k];});
    }
    if(r.why_m===undefined){r.why_m='';r.why_h='';}
  });
  /* 三個里程碑一定要在事項裡有一條對應的 event */
  MILESTONES.forEach(function(m){
    var hit=(s.rundown||[]).filter(function(r){return r.ms===m.ms;})[0];
    if(hit)return;
    var same=(s.rundown||[]).filter(function(r){return r.date===m.d;});
    var pick=same.filter(function(r){return /領證|登記|婚宴|领证|登记/.test(r.task||'');})[0]||same[0];
    if(pick){pick.ms=m.ms;if(pick.info==null)pick.info='';}
    else s.rundown.push({id:uid(),date:m.d,time:'',task:m.t,cat:'證件登記',owner:'雙方',liaison:'',vendor:'',status:'未開始',detail:'',steps:[],ms:m.ms,info:'',vids:[]});
  });
  if(s.dpAuto===undefined)s.dpAuto=true;
  if(!s.theme)s.theme='dark';
  (s.dayplan||[]).forEach(function(r){
    if(!r.cids)r.cids=[];
    if(!r.vids)r.vids=[];
    if(!r.cids.length&&r.who){
      (r.who.split(/[、,，\/]/)).forEach(function(nm){
        nm=nm.trim();if(!nm)return;
        var hit=(s.contacts||[]).filter(function(c){return c.name&&c.name===nm;})[0];
        if(hit&&r.cids.indexOf(hit.id)<0)r.cids.push(hit.id);
      });
    }
    if(!r.vids.length&&r.need){
      var hv=(s.vendors||[]).filter(function(v){return v.name&&v.name===r.need.trim();})[0];
      if(hv)r.vids=[hv.id];
    }
  });
  /* 事項裡打過的供應商文字，若和供應商池同名就自動接起來 */
  (s.rundown||[]).forEach(function(r){
    if(r.vids.length||!r.vendor)return;
    var hit=(s.vendors||[]).filter(function(v){return v.name&&v.name===r.vendor;})[0];
    if(hit)r.vids=[hit.id];
  });
  if(!s.principles)s.principles=DEFAULT_PRINCIPLES;
  s.v=3;
  return s;
}

function cloudPush(){

  syncState('busy','同步中…');
  rpc('plan_save',{p_room:room.room,p_secret:room.secret,p_data:state,p_by:room.who||''})

    })

function cloudPushSoon(){
  if(!room)return;
  localDirty=true;syncState('busy','待同步…');
  clearTimeout(pushTimer);pushTimer=setTimeout(cloudPush,1500);

function cloudPull(force){
  if(!room||pulling)return;
  pulling=true;
  rpc('plan_load',{p_room:room.room,p_secret:room.secret})
    .then(function(res){
      pulling=false;
      var r=(res&&res[0])||null;
      if(!r){cloudPush();return;}                       /* 房間還沒建，把本機這份推上去 */
      if(r.rev===cloudRev&&!force)return;
      if(localDirty&&!force){cloudPush();return;}       /* 本機有還沒推的改動，以本機為準 */
      if(r.data&&r.data.rundown){
        state=migrate(r.data);cloudRev=r.rev;
        applyTheme();renderRail();render();
        syncState('on','已同步'+(r.updated_by?' · '+r.updated_by+' 剛更新':''));
      }
    })
    .catch(function(){pulling=false;syncState('err','讀不到雲端');});
}

function passFilter(tab,r){
  if(tab==='rundown'){
    var f=filt.rundown;
    if(f.status&&r.status!==f.status)return false;
    if(f.owner&&r.owner!==f.owner)return false;
    if(f.q){var q=f.q.toLowerCase();
      var hay=[r.task,r.vendor,r.liaison,r.detail,r.cat].join(' ').toLowerCase();
      var st=(r.steps||[]).map(function(s){return s.t;}).join(' ').toLowerCase();
      if(hay.indexOf(q)<0&&st.indexOf(q)<0)return false;}
  }
  if(tab==='guests'&&filt.guests.side&&r.side!==filt.guests.side)return false;
  if(tab==='vendors'&&filt.vendors.cat&&r.cat!==filt.vendors.cat)return false;
  if(tab==='budget'&&filt.budget.kind&&r.kind!==filt.budget.kind)return false;
  return true;
}
function twdSrc(tab,r){
  if(tab==='budget')return (r.real!==''&&r.real!=null)?r.real:r.plan;

}
function cellFor(row,col,tab){

    td.textContent=twd(twdSrc(tab,row));

  var inp;

    inp=el('select');
    (col.o||[]).forEach(function(o){var op=el('option',null,o===''?'—':o);op.value=o;inp.appendChild(op);});
    if(col.o&&col.o.indexOf(row[col.k])<0){var op=el('option',null,row[col.k]||'—');op.value=row[col.k]||'';inp.appendChild(op);}
    inp.value=row[col.k]||'';
    inp.className='st-'+(row[col.k]||'');
  }else if(col.t==='textarea'){
    inp=el('textarea');inp.rows=1;inp.value=row[col.k]||'';
    setTimeout(function(){autoGrow(inp);},0);
  }else{
    inp=el('input');

    if(col.t==='number'){td.className='num';inp.step='1';}

/* ===== 行事曆 .ics ===== */
function icsEsc(t){return String(t||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function pad(n){return (n<10?'0':'')+n;}
function icsDate(d){return d.replace(/-/g,'');}
function icsStamp(){
  var d=new Date();
  return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z';
}
function icsEvent(r){
  if(!r.date)return '';
  var uidv=r.id+'@wedding-plan';
  var lines=['BEGIN:VEVENT','UID:'+uidv,'DTSTAMP:'+icsStamp()];
  var tm=/^(\d{1,2}):(\d{2})/.exec(r.time||'');
  if(tm){
    var h=pad(+tm[1]),mi=tm[2];
    var end=pad(Math.min(23,+tm[1]+1));
    lines.push('DTSTART:'+icsDate(r.date)+'T'+h+mi+'00');
    lines.push('DTEND:'+icsDate(r.date)+'T'+end+mi+'00');
  }else{
    var nx=new Date(parseD(r.date).getTime()+86400000);
    lines.push('DTSTART;VALUE=DATE:'+icsDate(r.date));
    lines.push('DTEND;VALUE=DATE:'+nx.getFullYear()+pad(nx.getMonth()+1)+pad(nx.getDate()));
  }
  lines.push('SUMMARY:'+icsEsc((r.ms?'★ ':'')+(r.task||'備婚事項')));
  var desc=[];
  if(r.owner)desc.push('負責人：'+r.owner);
  if(r.liaison)desc.push('對接人：'+r.liaison);
  var vn=vendorNames(r);
  if(vn.length)desc.push('供應商：'+vn.join('、'));
  else if(r.vendor)desc.push('供應商：'+r.vendor);
  if(r.detail)desc.push('',r.detail);
  if((r.steps||[]).length)desc.push('','子步驟：'+r.steps.map(function(s){return (s.done?'✓ ':'□ ')+s.t;}).join('　'));
  if(r.info)desc.push('','資料：'+r.info);
  lines.push('DESCRIPTION:'+icsEsc(desc.join('\n')));
  lines.push('BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(r.task||'備婚事項'),'END:VALARM');
  if(r.ms)lines.push('BEGIN:VALARM','TRIGGER:-P7D','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(r.task||'里程碑'),'END:VALARM');
  lines.push('END:VEVENT');
  return lines.join('\r\n');
}
function downloadIcs(rows,name){
  var body=rows.map(icsEvent).filter(Boolean).join('\r\n');
  if(!body){toast('這些事項還沒有日期，先填日期才能加進行事曆。');return;}
  var txt=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//備婚統籌台//TW','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:備婚統籌台',body,'END:VCALENDAR'].join('\r\n');
  var blob=new Blob([txt],{type:'text/calendar;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name+'.ics';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
}

function tmin(t){
  var m=/^(\d{1,2})[:：]?(\d{2})?/.exec((t||'').trim());
  if(!m)return null;
  return (+m[1])*60+(m[2]?+m[2]:0);
}
function sortDayplan(){
  var carry=-1;
  var keyed=state.dayplan.map(function(r,i){
    var v=tmin(r.time);
    if(v!==null)carry=v;
    return {r:r,k:(v!==null?v:(carry>=0?carry+0.5:99999)),i:i};
  });
  keyed.sort(function(a,b){return a.k-b.k||a.i-b.i;});
  state.dayplan=keyed.map(function(x){return x.r;});
}

    p.appendChild(el('div','note','把這條連結傳給對方，他打開就自動進同一個房間：'));
    var lk=el('div','link',shareLink());
    p.appendChild(lk);
    var r3=el('div','row2');r3.style.marginTop='8px';
    var cp=el('button','btn','複製連結');
    cp.addEventListener('click',function(){
      var t=shareLink();
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast('已複製');},function(){toast('複製失敗，長按上面那行自己複製');});
      else toast('長按上面那行複製');
    });
    var pl=el('button','btn','立刻拉取對方版本');
    pl.addEventListener('click',function(){cloudPull(true);toast('已從雲端拉取');});
    var lv=el('button','btn','離開房間（保留本機資料）');
    lv.addEventListener('click',function(){
      askConfirm('離開後這台就不再同步，本機資料保留。確定嗎？',function(){
        room=null;saveRoom();clearInterval(window.__syncTimer);
        syncState('','');document.getElementById('syncstate').hidden=true;
        renderSync();toast('已離開房間');
      });
    });
    r3.appendChild(cp);r3.appendChild(pl);r3.appendChild(lv);
    p.appendChild(r3);
    p.appendChild(el('div','note','兩邊每十秒對一次，也會在切回頁面時立刻對一次。同一格如果兩人幾秒內同時改，後存的那一次會蓋掉前一次——大改動前先喊一聲比較保險。'));
  }
  box.appendChild(p);
}

/* ================= 頁內提示與確認（沙箱裡 alert/confirm 會被忽略） ================= */
var toastTimer=null;
function toast(msg){
  var t=document.getElementById('toast');if(!t)return;
  t.textContent=msg;t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('on');},2600);
}
var cbarFn=null;
function askConfirm(msg,fn){
  var bar=document.getElementById('cbar');
  document.getElementById('cbarmsg').textContent=msg;
  cbarFn=fn;bar.hidden=false;
  bar.scrollIntoView({block:'nearest'});
}
function closeConfirm(){document.getElementById('cbar').hidden=true;cbarFn=null;}
document.getElementById('cbarok').addEventListener('click',function(){
  var f=cbarFn;closeConfirm();if(f)f();
});
document.getElementById('cbarno').addEventListener('click',closeConfirm);

var confirmDel=null,delTimer=null;
function delBtn(id,tab,plain){
  var isC=confirmDel===id;
  var b=el('button',(plain?'btn':'del')+(isC?' confirm':''),
    isC?(plain?'再按一次＝刪除':'確定?'):(plain?'刪除這件事':'×'));
  b.dataset.del=id;b.dataset.tab=tab;
  b.title=isC?'再按一次就刪除':'刪除';
  return b;
}

/* ================= 事件 ================= */
/* 滑鼠按著的時候先不要重畫，否則按鈕會在 click 之前被換掉，那一下就白點了 */
var pendingRender=false,pointerDown=false;
function renderSoon(){ if(pointerDown){pendingRender=true;} else render(); }
document.addEventListener('pointerdown',function(){pointerDown=true;},true);
document.addEventListener('pointerup',function(){
  pointerDown=false;
  setTimeout(function(){if(pendingRender)render();},300);
},true);

document.addEventListener('input',function(e){
  var t=e.target;if(!t.dataset)return;
  if(t.dataset.steptxt){
    var pr=state.rundown.filter(function(r){return r.id===t.dataset.pid;})[0];
    if(pr){var s=pr.steps.filter(function(x){return x.id===t.dataset.steptxt;})[0];if(s){s.t=t.value;save();}}
    return;
  }
  if(!t.dataset.tab)return;
  var tab=t.dataset.tab,row=state[tab].filter(function(r){return r.id===t.dataset.id;})[0];
  if(!row)return;
  row[t.dataset.k]=t.value;
  if(t.tagName==='TEXTAREA'&&t.closest('td'))autoGrow(t);
  if(t.tagName==='SELECT'&&t.closest('td'))t.className='st-'+t.value;
  if(['plan','real','paid','gift','price'].indexOf(t.dataset.k)>=0)refreshTwd();
  save();
},true);

document.addEventListener('change',function(e){
  var t=e.target;if(!t.dataset)return;
  if(t.dataset.chk){
    var r=state.rundown.filter(function(x){return x.id===t.dataset.chk;})[0];
    if(r){r.status=t.checked?'已完成':'未開始';save();renderSoon();}
    return;
  }
  if(t.dataset.stepchk){
    var pr=state.rundown.filter(function(x){return x.id===t.dataset.pid;})[0];
    if(pr){var s=pr.steps.filter(function(x){return x.id===t.dataset.stepchk;})[0];if(s){s.done=t.checked;save();renderSoon();}}
    return;
  }
  if(t.dataset.rerender){save();renderSoon();}
},true);

document.addEventListener('click',function(e){
  var hd=e.target.closest?e.target.closest('.dayhd,.peek'):null;
  if(hd&&!e.target.closest('input,select,button')){
    var k=hd.dataset.day;openDays[k]=!openDays[k];render();return;
  }
  var b=e.target.closest?e.target.closest('button'):null;
  if(!b||!b.dataset)return;
  var d=b.dataset;
  if(d.msopen){openMilestone(d.msopen);return;}
  if(d.venopen){
    if(d.venlist==='dayplan')openFlow[d.venopen]=true;else openTasks[d.venopen]=true;
    render();
    var n=document.querySelector('[data-rowid="'+d.venopen+'"]');if(n)n.scrollIntoView({block:'center'});
    return;
  }
  if(d.fexp){openFlow[d.fexp]=!openFlow[d.fexp];render();return;}
  if(d.rmove){moveRow(d.rtab,d.rmove,d.dir);return;}
  if(d.unlink){
    var pr=state[d.untab].filter(function(x){return x.id===d.pid;})[0];
    var kk=REF[d.unkind].key;
    if(pr){pr[kk]=(pr[kk]||[]).filter(function(v){return v!==d.unlink;});save();render();}
    return;
  }
  if(d.refadd){
    var pr2=state[d.reftab].filter(function(x){return x.id===d.refadd;})[0];
    var nameEl=document.querySelector('[data-refname="'+d.refadd+'"]');
    var catEl=document.querySelector('[data-refcat="'+d.refadd+'"]');
    var nm=nameEl?nameEl.value.trim():'';
    if(!nm){toast(d.refkind==='vendor'?'先填供應商名稱。':'先填姓名。');return;}
    var it;
    if(d.refkind==='vendor'){it=newVendor(catEl?catEl.value:VCATS[0]);it.name=nm;state.vendors.push(it);}
    else{it={id:uid(),name:nm,role:'',from:catEl?catEl.value:'其他',tel:'',note:''};state.contacts.push(it);}
    var key=REF[d.refkind].key;
    if(pr2)pr2[key]=(pr2[key]||[]).concat([it.id]);
    save();render();return;
  }
  if(d.ics){
    var r0=state.rundown.filter(function(x){return x.id===d.ics;})[0];
    if(r0)downloadIcs([r0],(r0.task||'備婚事項').slice(0,20));
    return;
  }
  if(d.goto){
    view.g=d.goto;view.s=d.gotosub||null;
    if(d.gotosub)lastSub[d.goto]=d.gotosub;
    render();window.scrollTo({top:0});
    return;
  }
  if(d.exp){openTasks[d.exp]=!openTasks[d.exp];render();return;}
  if(d.vexp){openVend[d.vexp]=!openVend[d.vexp];render();return;}
  if(d.move){moveTask(d.move,d.dir);return;}
  if(d.addtask!==undefined){addTask(d.addtask==='未定日期'?'':d.addtask);return;}
  if(d.stepadd){
    var r=state.rundown.filter(function(x){return x.id===d.stepadd;})[0];
    if(r){r.steps.push({id:uid(),t:'',done:false});save();render();}
    return;
  }
  if(d.stepdel){
    var pr=state.rundown.filter(function(x){return x.id===d.pid;})[0];
    if(pr){pr.steps=pr.steps.filter(function(x){return x.id!==d.stepdel;});save();render();}
    return;
  }
  if(d.del){
    var row=state[d.tab].filter(function(x){return x.id===d.del;})[0];
    var label=row?(row.task||row.item||row.name||row.title||''):'';
    if(confirmDel!==d.del){
      confirmDel=d.del;render();
      clearTimeout(delTimer);
      delTimer=setTimeout(function(){if(confirmDel){confirmDel=null;render();}},4500);
      toast('再按一次就刪除'+(label?'「'+label+'」':'這一列'));
      return;
    }
    confirmDel=null;clearTimeout(delTimer);
    state[d.tab]=state[d.tab].filter(function(x){return x.id!==d.del;});
    save();render();toast('已刪除');
  }
});

/* 改一整天的日期 */
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.daydate){moveDay(t.dataset.daydate,t.value);return;}
  if(t.dataset&&t.dataset.linkadd&&t.value){
    var r=state[t.dataset.linktab].filter(function(x){return x.id===t.dataset.linkadd;})[0];
    var key=REF[t.dataset.linkkind].key;
    if(r){r[key]=(r[key]||[]).concat([t.value]);save();renderSoon();}
    return;
  }
  if(t.dataset&&t.dataset.dpauto){state.dpAuto=t.checked;if(t.checked)sortDayplan();save();renderSoon();return;}
  if(t.dataset&&t.dataset.tab==='dayplan'&&t.dataset.k==='time'&&state.dpAuto!==false){sortDayplan();save();renderSoon();return;}
},true);

/* 拖放排序 */
var dragId=null,dragRow=null,dragList='rundown';
document.addEventListener('dragstart',function(e){
  var row=e.target.closest?e.target.closest('.drow[data-rowid]'):null;
  if(!row){return;}
  dragId=row.dataset.rowid;dragList=row.dataset.list;dragRow=row;
  row.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  try{e.dataTransfer.setData('text/plain',dragId);}catch(err){}
});
document.addEventListener('dragend',function(){
  dragId=null;
  if(dragRow){dragRow.draggable=false;dragRow=null;}
  [].forEach.call(document.querySelectorAll('.dragging,.dropbefore,.dropafter,.dropinto'),function(n){
    n.classList.remove('dragging','dropbefore','dropafter','dropinto');
  });
});
document.addEventListener('dragover',function(e){
  if(!dragId)return;
  var row=e.target.closest?e.target.closest('.drow[data-rowid]'):null;
  if(row&&row.dataset.list!==dragList)row=null;
  var day=dragList==='rundown'?(e.target.closest?e.target.closest('.dayhd'):null):null;
  [].forEach.call(document.querySelectorAll('.dropbefore,.dropafter,.dropinto'),function(n){
    n.classList.remove('dropbefore','dropafter','dropinto');
  });
  if(row&&row.dataset.rowid!==dragId){
    e.preventDefault();
    var r=row.getBoundingClientRect();
    row.classList.add(e.clientY>r.top+r.height/2?'dropafter':'dropbefore');
  }else if(day){
    e.preventDefault();
    var dz=day.closest('.day');if(dz)dz.classList.add('dropinto');
  }
});
document.addEventListener('drop',function(e){
  if(!dragId)return;
  var row=e.target.closest?e.target.closest('.drow[data-rowid]'):null;
  if(row&&row.dataset.list!==dragList)row=null;
  var day=dragList==='rundown'?(e.target.closest?e.target.closest('.dayhd'):null):null;
  e.preventDefault();
  if(row&&row.dataset.rowid!==dragId){
    var r=row.getBoundingClientRect();
    var after=e.clientY>r.top+r.height/2;
    if(dragList==='rundown')dropTask(dragId,row.dataset.rowid,after);
    else dropRow(dragList,dragId,row.dataset.rowid,after);
  }else if(day){
    dropIntoDay(dragId,day.dataset.day);
  }
  dragId=null;
});
document.addEventListener('click',function(){ if(pendingRender)render(); });
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){openTasks={};openVend={};openFlow={};render();}
});

/* ================= 匯入匯出 ================= */
document.getElementById('btnExport').addEventListener('click',function(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='備婚統籌台-'+todayISO()+'.json';
  a.click();URL.revokeObjectURL(a.href);
});
document.getElementById('btnImport').addEventListener('click',function(){document.getElementById('file').click();});
document.getElementById('file').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);
      if(!d||!d.rundown)throw new Error('bad');
      askConfirm('匯入會覆蓋目前所有內容，確定繼續？建議先匯出一份目前的備份。',function(){
        state=migrate(d);save();applyTheme();renderRail();render();toast('已匯入');
      });
    }catch(err){toast('這個檔案讀不出來，請選擇從本頁匯出的 .json 備份。');}
  };
  rd.readAsText(f);
  e.target.value='';
});
document.getElementById('btnReset').addEventListener('click',function(){
  askConfirm('重設會清掉你填過的所有內容，換回預設清單。確定嗎？建議先匯出備份。',function(){
    var th=state.theme;
    state=fresh();state.theme=th;openDays={};openTasks={};openVend={};openFlow={};
    save();openDefaults();applyTheme();renderRail();render();toast('已重設');
  });
});
document.getElementById('btnIcs').addEventListener('click',function(){
  var rows=state.rundown.filter(function(r){return r.date&&r.status!=='已完成'&&r.status!=='已取消';});
  if(!rows.length){toast('沒有未完成又有日期的事項。');return;}
  askConfirm('要匯出 '+rows.length+' 件未完成事項成一個 .ics 檔嗎？手機上點開就能整批加進行事曆。',function(){
    downloadIcs(rows,'備婚統籌台-'+todayISO());
  });
});
document.getElementById('btnSync').addEventListener('click',function(){
  syncOpen=!syncOpen;renderSync();
});
document.getElementById('btnTheme').addEventListener('click',function(){
  state.theme=(state.theme==='light')?'dark':'light';
  applyTheme();save();
});
document.getElementById('btnPrint').addEventListener('click',function(){window.print();});

/* ================= 啟動 ================= */
function openDefaults(){
  var future=[];
  state.rundown.forEach(function(r){
    var k=r.date||'未定日期',n=daysTo(r.date);
    if(n!==null&&n<0&&r.status!=='已完成'&&r.status!=='已取消')openDays[k]=true;
    if(n!==null&&n>=0)future.push(k);
  });
  future.sort();
  future.slice(0,3).forEach(function(k){openDays[k]=true;});
}
function start(){
  applyTheme();openDefaults();renderRail();render();
  setInterval(renderRail,3600000);
  if(room)startSync();
}
markSaved('讀取中…');
loadRoom();
if(STORE){
  STORE.get().then(function(v){
    var had=!!v;
    try{state=migrate(JSON.parse(v));}catch(e){state=null;}
    if(!state||!state.rundown){state=fresh();had=false;}
    markSaved(had?'已儲存':'');start();
    if(!had)save();
  }).catch(function(){
    state=fresh();markSaved('');start();save();
  });
}else{
  state=fresh();markSaved('無法儲存 · 請匯出備份');start();
}
})();
</script>
