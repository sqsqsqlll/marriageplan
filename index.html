<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14100F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="備婚統籌台">
<meta name="robots" content="noindex">
<title>毛 × 哈利 · 備婚統籌台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
<header>
  <h1 class="serif">毛<span class="amp">×</span>哈利 · 備婚統籌台</h1>
  <div class="toolbar">
    <span class="saved" id="saved"></span>
    <span class="sync" id="syncstate" hidden><span class="dot2"></span><span id="syncmsg"></span></span>
    <button class="btn" id="btnSync">雙人同步</button>
    <button class="btn" id="btnExport">匯出備份</button>
    <button class="btn" id="btnImport">匯入備份</button>
    <button class="btn" id="btnTheme">淺色</button>
    <button class="btn" id="btnIcs">行事曆 .ics</button>
    <button class="btn" id="btnPrint">列印本頁</button>
    <button class="btn" id="btnReset">重設內容</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
</header>

<section class="journey"><div class="rail" id="rail"></div><div class="brief" id="brief"></div></section>

<div id="syncbox"></div>
<div class="cbar" id="cbar" hidden><span id="cbarmsg"></span><button class="btn confirm" id="cbarok">確定</button><button class="btn" id="cbarno">取消</button></div>
<nav id="nav"></nav>
<div class="subnav" id="subnav"></div>
<div id="panel"></div>

</div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
