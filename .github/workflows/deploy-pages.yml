name: Deploy to GitHub Pages

on:
  push:
    branches: [main/planpage]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次部署，排队但不打断已经在跑的那次
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity check the site
        run: |
          for f in index.html style.css app.js; do
            test -s "$f" || { echo "$f is missing or empty"; exit 1; }
          done
          grep -qi '<!DOCTYPE html>' index.html || { echo "index.html is not an HTML document"; exit 1; }
          grep -qi '</html>' index.html || { echo "index.html looks truncated"; exit 1; }
          grep -q 'href="style.css"' index.html || { echo "index.html does not link style.css"; exit 1; }
          grep -q 'src="app.js"' index.html || { echo "index.html does not load app.js"; exit 1; }
          node --check app.js || { echo "app.js has a syntax error"; exit 1; }
          echo "OK: $(wc -c < index.html) + $(wc -c < style.css) + $(wc -c < app.js) bytes"

      # 檔名固定不變的話，瀏覽器會一直用快取裡那份舊的 app.js，
      # 部署了新版也看不到。這裡在檔名後面蓋一個 commit 戳記，網址一變就一定重抓。
      - name: Stamp asset versions
        run: |
          v="${GITHUB_SHA::7}"
          sed -i "s|href=\"style.css\"|href=\"style.css?v=$v\"|" index.html
          sed -i "s|src=\"app.js\"|src=\"app.js?v=$v\"|" index.html
          sed -i "s|</title>|</title>\n<meta name=\"build\" content=\"$v\">|" index.html
          grep -q "style.css?v=$v" index.html || { echo "stamping style.css failed"; exit 1; }
          grep -q "app.js?v=$v" index.html || { echo "stamping app.js failed"; exit 1; }
          grep -q "name=\"build\" content=\"$v\"" index.html || { echo "stamping build meta failed"; exit 1; }
          echo "stamped $v"
          grep -nE 'style.css|app.js|name="build"' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库还没开 Pages 的话，这里直接帮忙开，省掉手动去 Settings 点一次
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
